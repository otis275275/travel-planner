# Import .env file as a property source (optional means it won't fail if missing, e.g. in CI/Docker)
spring.config.import=optional:file:.env[.properties]

spring.application.name=backend
server.port=${PORT:8080}

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travelplanning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.create-schemas=true

# JWT settings
jwt.secret=${JWT_SECRET:defaultSecretKeyWhichIsAtLeast32BytesLongForHS256Algorithm!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OAuth2 Client (Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend Redirect URI after OAuth2 login
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/trips}

# Photon Geocoding & Autocomplete (OSM - Free, No key needed)
photon.base-url=${PHOTON_BASE_URL:https://photon.komoot.io}

# Unsplash API
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}
unsplash.base-url=${UNSPLASH_BASE_URL:https://api.unsplash.com}

# Gemini AI
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Cache & Redis settings (default to simple in-memory cache, switch to redis when available)
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.redis.time-to-live=1209600000

# SerpAPI Settings
serpapi.api-key=6ad217b38816b2d320e633333cfc2c75d3f8aebedb2b619ded2e02539999fbc2
serpapi.base-url=${SERPAPI_BASE_URL:https://serpapi.com/search.json}
serpapi.mock-mode=${SERPAPI_MOCK_MODE:false}


